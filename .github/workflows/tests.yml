---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0

      - name: Install the mutation toolchain
        uses: ramsey/composer-install@4.0.0
        with:
          working-directory: tools/infection

      # The floor comes from a token-level mutation run done off-tool (no
      # coverage driver was available where this was written); raise it to the
      # score Infection actually reports on the first green run.
      - name: Run Infection
        run: tools/infection/vendor/bin/infection --no-progress --threads=max --min-msi=85 --min-covered-msi=85

      - name: Upload the mutation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infection-log
          path: build/infection.log

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0

      - name: Install the benchmark toolchain
        uses: ramsey/composer-install@4.0.0
        with:
          working-directory: tools/phpbench

      # A shared runner's timings are too noisy to gate on. This job proves the
      # benchmarks still run and prints the numbers for the pull request.
      - name: Run PHPBench
        run: tools/phpbench/vendor/bin/phpbench run --report=aggregate --progress=none

  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate
        run: composer validate --strict
